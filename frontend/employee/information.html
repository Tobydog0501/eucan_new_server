<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>祐肯請假系統</title>
	<link rel="icon" type="image/x-icon" href="../img/logo.ico">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="../css/theme.css">
	<link id="eucan-navbar-css" rel="stylesheet" href="../css/navbar.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.4/jquery-confirm.min.css">
</head>

<body>

	<div id="navbar-container"></div>

	<main class="eu-page">
		<header class="eu-page-header">
			<h1 class="eu-page-title">詳細資料</h1>
			<div id="joinTime" class="eu-join-time"></div>
		</header>

		<div class="eu-page-narrow ms-0">
			<div id="search" class="eu-toolbar">
				<input placeholder="查詢年度(西元年)" id="date" class="search form-control">
				<button id="searching" class="search btn btn-primary">搜尋</button>
			</div>

			<div class="eu-card eu-card-flush">
				<table class="table eu-table-kv">
					<tbody>
						<tr id="year">
							<th>年資</th>
						</tr>
						<tr id="quota">
							<th>總特休時數(hr)</th>
						</tr>
						<tr id="annual">
							<th>已請特休假</th>
						</tr>
						<tr id="personal">
							<th>已請事假</th>
						</tr>
						<tr id="sick">
							<th>已請病假</th>
						</tr>
						<tr id="wedding">
							<th>已請婚假</th>
						</tr>
						<tr id="funeral">
							<th>已請喪假</th>
						</tr>
						<tr id="care">
							<th>已請家庭照顧假</th>
						</tr>
						<tr id="birth">
							<th>已請分娩假</th>
						</tr>
						<tr id="pcheckup">
							<th>已請產檢假</th>
						</tr>
						<tr id="miscarriage">
							<th>已請流產假</th>
						</tr>
						<tr id="paternity">
							<th>已請陪產假</th>
						</tr>
						<tr id="maternity">
							<th>已請產假</th>
						</tr>
						<tr id="official">
							<th>已請公假</th>
						</tr>
						<tr id="typhoon">
							<th>停班停課</th>
						</tr>
					</tbody>
				</table>
			</div>
		</div>
	</main>

	<script src="../js/jquery-3.7.1.min.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.4/jquery-confirm.min.js"></script>
	<script src="../js/cookieOperation.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	<script src="../js/employeeInformation.js"></script>
</body>

</html>
