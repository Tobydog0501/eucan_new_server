<!DOCTYPE html>
<html lang="zh-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>祐肯請假系統</title>
    <link rel="icon" type="image/x-icon" href="../../img/logo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>

<body>
    <div id="navbar-container"></div>

    <section class="container my-4" style="max-width: 720px;">
        <h1 class="mb-3 text-center">補登申請</h1>
        <form id="makeupForm" class="border rounded p-3 bg-light" novalidate>
            <div class="row g-3">
                <div class="col-sm-6">
                    <label class="form-label" for="applicant">申請人</label>
                    <input id="applicant" class="form-control" type="text" readonly>
                </div>
                <div class="col-sm-6">
                    <label class="form-label" for="department">部門</label>
                    <input id="department" class="form-control" type="text" readonly>
                </div>
                <div class="col-sm-6">
                    <label class="form-label" for="date">未打卡日期 <span class="text-danger">*</span></label>
                    <input id="date" class="form-control" type="date" required>
                </div>
                <div class="col-sm-6">
                    <label class="form-label" for="kind">未打卡類別 <span class="text-danger">*</span></label>
                    <select id="kind" class="form-select" required>
                        <option value="in">上班未打卡</option>
                        <option value="out">下班未打卡</option>
                        <option value="both">上下班皆未打卡</option>
                    </select>
                </div>
                <div class="col-sm-6">
                    <label class="form-label" for="clockin">實際上班時間 <span class="text-danger" id="clockinStar">*</span></label>
                    <input id="clockin" class="form-control" type="time">
                </div>
                <div class="col-sm-6">
                    <label class="form-label" for="clockout">實際下班時間 <span class="text-danger" id="clockoutStar">*</span></label>
                    <input id="clockout" class="form-control" type="time">
                </div>
                <div class="col-12">
                    <label class="form-label" for="reason">未打卡原因 <span class="text-danger">*</span></label>
                    <textarea id="reason" class="form-control" rows="3" maxlength="200" required></textarea>
                </div>
                <div class="col-sm-6">
                    <label class="form-label" for="appliedOn">申請日期</label>
                    <input id="appliedOn" class="form-control" type="text" readonly>
                </div>
                <div class="col-12">
                    <div id="formError" class="text-danger" role="alert"></div>
                    <button id="submitBtn" type="submit" class="btn btn-primary">送出申請</button>
                </div>
            </div>
        </form>
    </section>

    <section class="container my-4" style="max-width: 960px;">
        <h2 class="h4">我的補登申請</h2>
        <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle">
                <thead>
                    <tr>
                        <th>未打卡日期</th>
                        <th>類別</th>
                        <th>上班</th>
                        <th>下班</th>
                        <th>原因</th>
                        <th>申請日期</th>
                        <th>狀態</th>
                        <th>審核說明</th>
                    </tr>
                </thead>
                <tbody id="mine">
                    <tr><td colspan="8" class="text-center text-muted">尚無申請</td></tr>
                </tbody>
            </table>
        </div>
    </section>

    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/cookieOperation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/employeeMakeup.js"></script>
</body>

</html>
