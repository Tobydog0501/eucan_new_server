<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>祐肯請假系統</title>
    <link rel="icon" type="image/x-icon" href="../img/logo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/theme.css">
    <link id="eucan-navbar-css" rel="stylesheet" href="../css/navbar.css">
</head>

<body>
    <div id="navbar-container"></div>

    <main class="eu-page">
        <header class="eu-page-header">
            <h1 class="eu-page-title">補打卡申請</h1>
            <p class="eu-page-subtitle">系統列出近一個月應打卡卻沒有打卡、也沒有請假的時段；填寫原因後送交主管審核。</p>
        </header>

        <h2 class="eu-section-title">未打卡紀錄</h2>
        <div id="missing" class="eu-punch-grid" aria-live="polite">
            <p class="text-muted mb-0">載入中…</p>
        </div>

        <h2 class="eu-section-title mt-4">我的補打卡申請</h2>
        <div class="eu-card eu-card-flush">
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>未打卡日期</th>
                            <th>類別</th>
                            <th>實際上班</th>
                            <th>實際下班</th>
                            <th>原因</th>
                            <th>申請日期</th>
                            <th>狀態</th>
                            <th>審核說明</th>
                        </tr>
                    </thead>
                    <tbody id="mine">
                        <tr><td colspan="8" class="text-center text-muted">尚無申請</td></tr>
                    </tbody>
                </table>
            </div>
        </div>
    </main>

    <div class="modal fade" id="applyModal" tabindex="-1" aria-labelledby="applyTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <form id="applyForm" class="modal-content" novalidate>
                <div class="modal-header">
                    <h2 class="modal-title fs-5" id="applyTitle">申請補打卡</h2>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-bordered eu-table-kv mb-3">
                        <tbody>
                            <tr><th scope="row">未打卡日期</th><td id="applyDate"></td></tr>
                            <tr><th scope="row">未打卡類別</th><td id="applyKind"></td></tr>
                        </tbody>
                    </table>
                    <label class="form-label" for="actualTime"><span id="actualTimeLabel">實際時間</span> <span class="text-danger">*</span></label>
                    <input id="actualTime" type="time" class="form-control mb-1" required>
                    <div id="actualTimeHint" class="form-text mb-3"></div>
                    <label class="form-label" for="reason">未打卡原因 <span class="text-danger">*</span></label>
                    <textarea id="reason" class="form-control" rows="3" maxlength="200" required></textarea>
                    <div id="formError" class="text-danger mt-2" role="alert"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                    <button id="submitBtn" type="submit" class="btn btn-primary">送出申請</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/cookieOperation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../js/employeeMakeup.js"></script>
</body>

</html>
