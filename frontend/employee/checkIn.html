<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>祐肯請假系統</title>
    <link rel="icon" type="image/x-icon" href="../img/logo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/theme.css">
    <link id="eucan-navbar-css" rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/employeeCheckIn.css">
</head>

<body>
    <div id="navbar-container"></div>

    <main class="eu-page eu-page-narrow">
        <header class="eu-page-header">
            <h1 class="eu-page-title">打卡</h1>
        </header>

        <section class="eu-card">
            <p id="time" class="punch-clock"></p>

            <div class="punch-actions">
                <button id="workButton" type="button" class="punch-btn punch-btn-in">
                    <img src="../img/work.jpg" alt="">
                    <span class="punch-btn-label">上班打卡</span>
                </button>
                <button id="restButton" type="button" class="punch-btn punch-btn-out">
                    <img src="../img/getOffWork.png" alt="">
                    <span class="punch-btn-label">下班打卡</span>
                </button>
            </div>

            <table class="table table-bordered eu-table-kv punch-status">
                <tbody>
                    <tr>
                        <th>上班</th>
                        <td id="work"></td>
                    </tr>
                    <tr>
                        <th>下班</th>
                        <td id="rest"></td>
                    </tr>
                </tbody>
            </table>
        </section>

        <section class="eu-card">
            <h2 class="eu-section-title">注意事項</h2>
            <ul class="punch-notes">
                <li>依《勞動基準法》第30條第5款規定：「雇主應置備勞工出勤紀錄，並保存五年。」</li>
                <li>請等上班時間到再打卡</li>
                <li>請於18:00前打卡下班</li>
                <li>員工上下班時間需依規定記錄出勤，如果忘記打卡, 沒有紀錄上下班時間，就由雇主代為記錄</li>
                <li>加班須先申請，經主管核准</li>
            </ul>
        </section>
    </main>

    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/cookieOperation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../js/employeeCheckIn.js"></script>
</body>

</html>
