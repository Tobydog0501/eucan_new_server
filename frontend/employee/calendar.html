<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>祐肯請假系統</title>
  <link rel="icon" type="image/x-icon" href="../img/logo.ico">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
  <link rel="stylesheet" href="../css/theme.css">
  <link id="eucan-navbar-css" rel="stylesheet" href="../css/navbar.css">
  <link rel="stylesheet" href="../css/calendar.css">
</head>

<body>
  <div id="navbar-container"></div>

  <main class="eu-page">
    <header class="eu-page-header">
      <h1 class="eu-page-title">行事曆</h1>
    </header>

    <div class="calendar-toolbar">
      <div class="calendar-filters">
        <select id="year" class="form-select calendar-select" aria-label="年">
          <option value="2025">2025年</option>
          <option value="2026">2026年</option>
        </select>
        <select id="month" class="form-select calendar-select" aria-label="月">
          <option value="1">1月</option>
          <option value="2">2月</option>
          <option value="3">3月</option>
          <option value="4">4月</option>
          <option value="5">5月</option>
          <option value="6">6月</option>
          <option value="7">7月</option>
          <option value="8">8月</option>
          <option value="9">9月</option>
          <option value="10">10月</option>
          <option value="11">11月</option>
          <option value="12">12月</option>
        </select>
      </div>
    </div>
    <div id="calendar" class="calendar-shell">
      <div id="calendarGrid"></div>
    </div>
  </main>

  <script src="../js/jquery-3.7.1.min.js"></script>
  <script src="../js/cookieOperation.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
  <script src="../js/employeeCalendar.js"></script>
</body>

</html>
