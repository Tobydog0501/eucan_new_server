<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>祐肯請假系統</title>
	<link rel="icon" type="image/x-icon" href="../img/logo.ico">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="../css/theme.css">
	<link id="eucan-navbar-css" rel="stylesheet" href="../css/navbar.css">
	<link rel="stylesheet" href="../css/employeeleave.css">
</head>

<body>

	<div id="navbar-container"></div>

	<main class="eu-page">
		<header class="eu-page-header">
			<h1 class="eu-page-title">請假</h1>
		</header>

		<div class="eu-page-narrow ms-0">
			<section id="info" class="eu-card">
				<h2 class="eu-section-title">特休假</h2>
				<div class="leave-year-row">
					<select class="form-select" aria-label="年度">
						<option>當年度</option>
						<option>下年度</option>
					</select>
					<button type="button" id="search" class="btn btn-outline-primary">查詢</button>
				</div>
				<div class="leave-stats">
					<div class="leave-stat">
						<div class="leave-stat-label"><span id="quota-text"></span>特休假總時數</div>
						<p id="quota" class="leave-stat-value"></p>
					</div>
					<div class="leave-stat">
						<div class="leave-stat-label"><span id="annual-text"></span>特休假已休時數</div>
						<p id="annual" class="leave-stat-value"></p>
					</div>
				</div>
			</section>

			<section class="eu-card">
				<h2 class="eu-section-title">送出假單</h2>
				<div class="row g-3">
					<div id="dayofftypeD" class="col-12">
						<label class="form-label" for="type">假別</label>
						<select id="type" class="form-select">
							<option>選擇假別</option>
							<option>特休假</option>
							<option>事假</option>
							<option>病假</option>
							<option>婚假</option>
							<option>喪假</option>
							<option>家庭照顧假</option>
							<option>分娩假</option>
							<option>產檢假</option>
							<option>流產假</option>
							<option>陪產假</option>
							<option>產假</option>
							<option>公假</option>
							<option>停班停課</option>
						</select>
					</div>

					<div id="startD" class="col-12">
						<label class="form-label" for="start_day">開始時間</label>
						<div class="leave-datetime">
							<input id="start_day" class="form-control" type="date" min="2024-01-01" max="5000-12-31" />
							<input id="start_time" class="form-control" type="time" aria-label="開始時刻" />
						</div>
					</div>

					<div id="endD" class="col-12">
						<label class="form-label" for="end_day">結束時間</label>
						<div class="leave-datetime">
							<input id="end_day" class="form-control" type="date" min="2024-01-01" max="5000-12-31" />
							<input id="end_time" class="form-control" type="time" aria-label="結束時刻" />
						</div>
					</div>

					<div id="reasonD" class="col-12">
						<label class="form-label" for="reason">事由</label>
						<input type="text" class="form-control" placeholder="事由" id="reason" />
					</div>

					<div class="col-12">
						<button type="button" id="submit" class="btn btn-primary leave-submit">送出申請</button>
					</div>
				</div>
			</section>
		</div>
	</main>

	<script src="../js/jquery-3.7.1.min.js"></script>
	<script src="../js/cookieOperation.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	<script src="../js/employeeleave.js"></script>
</body>

</html>
