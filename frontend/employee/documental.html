<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>祐肯請假系統</title>
    <link rel="icon" type="image/x-icon" href="../img/logo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/theme.css">
    <link id="eucan-navbar-css" rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/employeeDocumental.css">
</head>

<body>

    <div id="navbar-container"></div>

    <main class="eu-page">
        <header class="eu-page-header">
            <h1 class="eu-page-title">請假紀錄</h1>
            <a class="btn btn-outline-secondary" href="./information.html">詳細資料</a>
        </header>

        <div class="eu-toolbar">
            <input type="text" class="form-control" placeholder="年度" id="year" />
            <button class="btn btn-primary" id="search">搜尋</button>
        </div>

        <div class="leave-filter-group" role="group" aria-label="假單狀態篩選">
            <button id="wait" class="leave-filter-btn leave-filter-wait" type="button">待審核</button>
            <button id="approve" class="leave-filter-btn leave-filter-approve" type="button">已核准</button>
            <button id="reject" class="leave-filter-btn leave-filter-reject" type="button">已拒絕</button>
        </div>

        <div class="eu-card eu-card-flush">
            <div class="table-responsive">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>流水號</th>
                            <th>員工姓名</th>
                            <th>請假類別</th>
                            <th>請假事由</th>
                            <th>開始時間</th>
                            <th>結束時間</th>
                            <th>狀態</th>
                        </tr>
                    </thead>
                    <tbody id="table"></tbody>
                </table>
            </div>
        </div>
        <nav class="eu-pager" aria-label="分頁">
            <button id="prevPage" class="btn btn-outline-secondary">上一頁</button>
            <span id="pageInfo"></span>
            <button id="nextPage" class="btn btn-outline-secondary">下一頁</button>
        </nav>
    </main>


    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/cookieOperation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../js/employeeDocumental.js"></script>
</body>

</html>
