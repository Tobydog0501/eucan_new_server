<!DOCTYPE html>
<html lang="zh-Hant-TW">
    <head>
		<meta charset="UTF-8">
		<meta name="viewport" content="width=device-width, initial-scale=1">
		<title>祐肯請假系統</title>
		<link rel="icon" type="image/x-icon" href="./img/logo.ico">

		<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
		<link rel="stylesheet" href="css/theme.css">
		<link rel="stylesheet" href="css/index.css">
    </head>
	<body class="login-body">
		<main class="login-main">
			<div class="login-card">
				<img src="./img/logo.png" alt="EUCAN 祐肯" class="login-logo">
				<h1 class="login-title">
					祐肯企業<br>請假系統
				</h1>
				<form id="loginForm" class="login-stack">
					<div class="inputs">
						<label class="form-label" for="code">員工編號</label>
						<input type="text" id="code" class="form-control" placeholder="輸入編號" autocomplete="username" />
					</div>
					<div class="inputs">
						<label class="form-label" for="pw">密碼</label>
						<div class="password-field">
							<input type="password" id="pw" class="form-control" placeholder="輸入密碼" autocomplete="current-password" />
							<button type="button" id="togglePw" class="pw-toggle">顯示</button>
						</div>
					</div>
					<div class="inputs">
						<button type="submit" class="btn btn-primary login-submit" id="login">登入</button>
					</div>
				</form>
			</div>
		</main>
		<footer class="version-info">
			版本： 6.16.0
			製作者：章凱昱、吳岱威
		</footer>
		<script src="js/jquery-3.7.1.min.js"></script>
        <script src="js/cookieOperation.js"></script>
		<script src="js/index.js"></script>
	</body>

</html>
