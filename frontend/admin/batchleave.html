<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>祐肯請假系統</title>
    <link rel="icon" type="image/x-icon" href="../img/logo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/theme.css">
    <link id="eucan-navbar-css" rel="stylesheet" href="../css/navbar.css">
</head>

<body>
    <div id="navbar-container"></div>

    <main class="eu-page">
        <header class="eu-page-header">
            <h1 class="eu-page-title">批次請假</h1>
            <p class="eu-page-subtitle">勾選在職員工，以同一段起迄時間一次建立假單。送出後直接通過，不必再審核。</p>
        </header>

        <section class="eu-card">
            <form id="batchForm" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="type">假別</label>
                    <select id="type" class="form-select" required>
                        <option>特休假</option>
                        <option>事假</option>
                        <option>病假</option>
                        <option>婚假</option>
                        <option>喪假</option>
                        <option>家庭照顧假</option>
                        <option>分娩假</option>
                        <option>產檢假</option>
                        <option>流產假</option>
                        <option>陪產假</option>
                        <option>產假</option>
                        <option>公假</option>
                        <option selected>停班停課</option>
                        <option>其他</option>
                    </select>
                </div>
                <div class="col-md-8">
                    <label class="form-label" for="reason">事由</label>
                    <input id="reason" class="form-control" type="text" placeholder="例如：颱風天停班停課" required>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label" for="start_day">開始日期</label>
                    <input id="start_day" class="form-control" type="date" required>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label" for="start_time">開始時間</label>
                    <input id="start_time" class="form-control" type="time" step="1800" required>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label" for="end_day">結束日期</label>
                    <input id="end_day" class="form-control" type="date" required>
                </div>
                <div class="col-6 col-md-3">
                    <label class="form-label" for="end_time">結束時間</label>
                    <input id="end_time" class="form-control" type="time" step="1800" required>
                </div>
                <div class="col-12">
                    <button type="submit" id="submit" class="btn btn-primary">送出批次請假</button>
                </div>
            </form>
        </section>

        <div class="eu-toolbar">
            <input id="search" class="form-control" type="search" placeholder="搜尋姓名或員工編號">
            <button type="button" id="selectVisible" class="btn btn-outline-primary">全選目前名單</button>
            <button type="button" id="clearSelect" class="btn btn-outline-secondary">清除勾選</button>
            <span id="selectedCount" class="text-muted">已選 0 人</span>
        </div>

        <section class="eu-card">
            <div id="table" class="eu-pick-grid" aria-label="在職員工"></div>
        </section>

        <section id="result" class="eu-card mt-4" hidden>
            <h2 class="eu-section-title">送出結果</h2>
            <div id="resultBody"></div>
        </section>
    </main>

    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/cookieOperation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../js/adminBatchLeave.js"></script>
</body>

</html>
