<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <title>祐肯請假系統</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../../img/logo.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/adminPersonnel.css">
</head>

<body>
    <div id="navbar-container"></div>

    <main class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <div>
                <h1 class="mb-1">員工資料卡片</h1>
                <div class="text-muted">修改除員工編號外的所有欄位；若狀態為離職，離職時間必填。</div>
            </div>
            <a class="btn btn-outline-secondary" href="./personnel.html">返回列表</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <form id="employeeForm" class="row g-3">
                    <div class="col-md-4">
                        <label class="form-label">員工編號</label>
                        <input id="id" class="form-control" readonly>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">員工姓名</label>
                        <input id="name" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">密碼</label>
                        <input id="pwd" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">電子信箱</label>
                        <input id="email" type="email" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">到職日期</label>
                        <input id="joinTime" type="date" class="form-control" required>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">員工類型</label>
                        <select id="type" class="form-select" required>
                            <option value="employee">employee</option>
                            <option value="admin">admin</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">直屬主管</label>
                        <select id="mgroup" class="form-select" required>
                            <option value="0">JEFF</option>
                            <option value="1">CAT</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">是否審核</label>
                        <select id="permit" class="form-select" required>
                            <option value="1">須審核</option>
                            <option value="0">無須審核</option>
                        </select>
                    </div>
                    <div class="col-md-4">
                        <label class="form-label">員工狀態</label>
                        <select id="status" class="form-select" required>
                            <option value="1">在職</option>
                            <option value="0">離職</option>
                        </select>
                    </div>
                    <div class="col-md-4" id="leaveDateWrap">
                        <label class="form-label">離職時間</label>
                        <input id="leaveDate" type="datetime-local" class="form-control">
                    </div>
                    <div class="col-12">
                        <div class="alert alert-warning mb-0">
                            修改到職日期後，系統會依新日期重新計算年資與特休額度。
                        </div>
                    </div>
                    <div class="col-12 d-flex gap-2">
                        <button type="submit" class="btn btn-primary">儲存變更</button>
                        <button type="button" id="reload" class="btn btn-outline-secondary">重新載入</button>
                    </div>
                </form>
            </div>
        </div>
    </main>

    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/cookieOperation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/adminEmployeeDetail.js"></script>
</body>

</html>
