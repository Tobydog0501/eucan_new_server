<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>祐肯請假系統</title>
    <link rel="icon" type="image/x-icon" href="../img/logo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/theme.css">
    <link id="eucan-navbar-css" rel="stylesheet" href="../css/navbar.css">
</head>

<body>
    <div id="navbar-container"></div>

    <main class="eu-page">
        <header class="eu-page-header">
            <h1 class="eu-page-title">員工資料卡片</h1>
            <a class="btn btn-outline-secondary" href="./personnel.html">返回列表</a>
            <p class="eu-page-subtitle">修改除員工編號外的所有欄位；若狀態為離職，離職時間必填。</p>
        </header>

        <section class="eu-card">
            <form id="employeeForm" class="row g-3">
                <div class="col-md-4">
                    <label class="form-label" for="id">員工編號</label>
                    <input id="id" class="form-control" readonly>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="employeeName">員工姓名</label>
                    <input id="employeeName" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="pwd">密碼</label>
                    <input id="pwd" type="password" class="form-control" placeholder="留空表示不變更" autocomplete="new-password">
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="email">電子信箱</label>
                    <input id="email" type="email" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="joinTime">到職日期</label>
                    <input id="joinTime" type="date" class="form-control" required>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="type">員工類型</label>
                    <select id="type" class="form-select" required>
                        <option value="employee">employee</option>
                        <option value="admin">admin</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="mgroup">直屬主管</label>
                    <select id="mgroup" class="form-select" required>
                        <option value="0">JEFF</option>
                        <option value="1">CAT</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="permit">是否審核</label>
                    <select id="permit" class="form-select" required>
                        <option value="1">須審核</option>
                        <option value="0">無須審核</option>
                    </select>
                </div>
                <div class="col-md-4">
                    <label class="form-label" for="status">員工狀態</label>
                    <select id="status" class="form-select" required>
                        <option value="1">在職</option>
                        <option value="0">離職</option>
                    </select>
                </div>
                <div class="col-md-4" id="leaveDateWrap">
                    <label class="form-label" for="leaveDate">離職時間</label>
                    <input id="leaveDate" type="date" class="form-control">
                </div>
                <div class="col-12">
                    <div class="alert alert-warning mb-0">
                        修改到職日期後，系統會依新日期重新計算年資與特休額度。
                    </div>
                </div>
                <div class="col-12 d-flex gap-2">
                    <button type="submit" class="btn btn-primary">儲存變更</button>
                    <button type="button" id="reload" class="btn btn-outline-secondary">重新載入</button>
                </div>
            </form>
        </section>
    </main>

    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/cookieOperation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../js/adminEmployeeDetail.js"></script>
</body>

</html>
