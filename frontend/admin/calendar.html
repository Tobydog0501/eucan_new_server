<!DOCTYPE html>
<html>

<head>
	<title>祐肯請假系統</title>

	<meta name="viewport" content="width=device-width, initial-scale=1">
	<meta content="text/html;charset=utf-8" http-equiv="Content-Type">
	<meta content="utf-8" http-equiv="encoding">
	<link rel="icon" type="image/x-icon" href="../../img/logo.ico">

	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0/dist/css/bootstrap.min.css" rel="stylesheet"
		integrity="sha384-wEmeIV1mKuiNpC+IOBjI7aAzPcEZeedi5yW5f2yOq55WWLwNGmvvx4Um1vskeMj0" crossorigin="anonymous">
	<link rel="stylesheet" href="../css/calendar.css">
	<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.4/jquery-confirm.min.css">
</head>

<body>

	<div id="navbar-container"></div>

	<section>
		<div class="container">
			<div class="row">
				<div class="col">
					<h1>行事曆</h1>
				</div>
			</div>
		</div>
	</section>

	<section>
		<div class="container">
			<div class="row">
				<div class="col">
					<div id="calendar">
						<div class="calendar-toolbar">
							<div class="calendar-filters">
								<select id="year" class="form-select calendar-select">
									<option value="2025">2025年</option>
									<option value="2026">2026年</option>
								</select>
								<select id="month" class="form-select calendar-select">
									<option value="1">1月</option>
									<option value="2">2月</option>
									<option value="3">3月</option>
									<option value="4">4月</option>
									<option value="5">5月</option>
									<option value="6">6月</option>
									<option value="7">7月</option>
									<option value="8">8月</option>
									<option value="9">9月</option>
									<option value="10">10月</option>
									<option value="11">11月</option>
									<option value="12">12月</option>
								</select>
								<button id="upData" class="btn btn-primary">重新載入</button>
								<a class="btn btn-outline-secondary"
									href="https://drive.google.com/drive/folders/1YkJ9qs0lIDk5BfGMr_xV5bA7YmFn7S_p?usp=sharing"
									target="_blank" rel="noopener">查看雲端歷史資料</a>
							</div>
						</div>
						<div id="calendarGrid" class="calendar-shell"></div>
					</div>
				</div>
			</div>
		</div>
	</section>

	<script src="../js/jquery-3.7.1.min.js"></script>
	<script src="../js/cookieOperation.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"
		integrity="sha384-/bQdsTh/da6pkI1MST/rWKFNjaCP5gBSY4sEBT38Q/9RBh9AH40zEOg7Hlq2THRZ"
		crossorigin="anonymous"></script>
	<script src="../js/adminCalendar.js"></script>
	<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery-confirm/3.3.4/jquery-confirm.min.js"></script>
</body>

</html>
