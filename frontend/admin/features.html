<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>祐肯請假系統</title>
    <link rel="icon" type="image/x-icon" href="../img/logo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/theme.css">
    <link id="eucan-navbar-css" rel="stylesheet" href="../css/navbar.css">
</head>

<body>
    <div id="navbar-container"></div>

    <main class="eu-page">
        <header class="eu-page-header">
            <h1 class="eu-page-title">功能管理</h1>
            <span class="eu-page-subtitle" id="now"></span>
        </header>

        <p class="eu-release-intro">
            開發人員把新功能做完並部署後，由主管在這裡決定上線時間。上線時間到之前，功能對員工保持隱藏；時間一到自動上線。
        </p>

        <div id="features" aria-label="功能列表">
            <p class="text-muted">載入中…</p>
        </div>

        <h2 class="eu-section-title">發布紀錄</h2>
        <div class="eu-card eu-card-flush">
            <div class="table-responsive">
                <table class="table table-striped align-middle">
                    <thead>
                        <tr>
                            <th>時間</th>
                            <th>功能</th>
                            <th>內容</th>
                            <th>操作人</th>
                        </tr>
                    </thead>
                    <tbody id="history"></tbody>
                </table>
            </div>
        </div>
    </main>

    <!-- 排定／改上線時間 -->
    <div class="modal fade" id="scheduleModal" tabindex="-1" aria-labelledby="scheduleTitle" aria-hidden="true">
        <div class="modal-dialog modal-dialog-centered">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title" id="scheduleTitle">排定上線</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
                </div>
                <div class="modal-body">
                    <p class="fw-semibold mb-1" id="scheduleFeature"></p>
                    <p class="text-muted small mb-3" id="scheduleCurrent"></p>
                    <label for="scheduleAt" class="form-label">上線時間（台北時間）</label>
                    <input type="datetime-local" id="scheduleAt" class="form-control">
                    <div class="form-text" id="schedulePreview"></div>
                    <div class="text-danger small mt-2 d-none" id="scheduleError" role="alert"></div>
                </div>
                <div class="modal-footer">
                    <button type="button" class="btn btn-outline-secondary" data-bs-dismiss="modal">取消</button>
                    <button type="button" class="btn btn-primary" id="scheduleSave">確認排定</button>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/cookieOperation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../js/adminFeatures.js"></script>
</body>

</html>
