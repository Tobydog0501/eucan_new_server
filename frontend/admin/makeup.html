<!DOCTYPE html>
<html lang="zh-Hant">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>祐肯請假系統</title>
    <link rel="icon" type="image/x-icon" href="../../img/logo.ico">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>

<body>
    <div id="navbar-container"></div>

    <section class="container my-4">
        <h1 class="mb-3 text-center">補登審核</h1>
        <div class="d-flex justify-content-center gap-2 mb-3" role="group" aria-label="狀態篩選">
            <select id="state" class="form-select w-auto">
                <option value="pending">待審</option>
                <option value="approved">核准</option>
                <option value="rejected">駁回</option>
                <option value="all">全部</option>
            </select>
        </div>
        <div class="table-responsive">
            <table class="table table-bordered table-striped align-middle">
                <thead>
                    <tr>
                        <th>申請人</th>
                        <th>部門</th>
                        <th>未打卡日期</th>
                        <th>類別</th>
                        <th>上班</th>
                        <th>下班</th>
                        <th>原因</th>
                        <th>申請日期</th>
                        <th>狀態</th>
                        <th>操作</th>
                    </tr>
                </thead>
                <tbody id="requests"></tbody>
            </table>
        </div>
    </section>

    <!-- 稽核紀錄 -->
    <div class="modal fade" id="auditModal" tabindex="-1" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <div class="modal-header">
                    <h5 class="modal-title">稽核紀錄</h5>
                    <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
                </div>
                <div class="modal-body">
                    <table class="table table-sm">
                        <thead><tr><th>時間</th><th>動作</th><th>操作人</th><th>原因</th></tr></thead>
                        <tbody id="auditRows"></tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/cookieOperation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/adminMakeup.js"></script>
</body>

</html>
