<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>祐肯請假系統</title>
    <link rel="icon" type="image/x-icon" href="../img/logo.ico">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <link rel="stylesheet" href="../css/theme.css">
    <link id="eucan-navbar-css" rel="stylesheet" href="../css/navbar.css">
    <link rel="stylesheet" href="../css/calendar.css">
</head>

<body>

    <div id="navbar-container"></div>

    <main class="eu-page">
        <header class="eu-page-header">
            <h1 class="eu-page-title">打卡紀錄</h1>
        </header>

        <div id="calendar" class="record-calendar-page">
            <div class="calendar-toolbar record-toolbar">
                <div class="calendar-filters record-filters">
                    <select id="year" class="form-select calendar-select" aria-label="年">
                        <option value="2025">2025年</option>
                        <option value="2026">2026年</option>
                    </select>
                    <select id="month" class="form-select calendar-select" aria-label="月">
                        <option value="1">1月</option>
                        <option value="2">2月</option>
                        <option value="3">3月</option>
                        <option value="4">4月</option>
                        <option value="5">5月</option>
                        <option value="6">6月</option>
                        <option value="7">7月</option>
                        <option value="8">8月</option>
                        <option value="9">9月</option>
                        <option value="10">10月</option>
                        <option value="11">11月</option>
                        <option value="12">12月</option>
                    </select>
                    <select id="day" class="form-select calendar-select" aria-label="日"></select>
                    <select id="employee" class="form-select calendar-select" aria-label="員工">
                        <option value="">全部</option>
                    </select>
                    <button id="upData" class="btn btn-primary">重新載入</button>
                    <button id="downloadMaster" class="btn btn-outline-primary" type="button" disabled title="請先重新載入，產生該月總表">下載月總表</button>
                    <a class="btn btn-outline-secondary"
                        href="https://drive.google.com/drive/folders/1_4mNF0GZOGRhZ30ZHcm6zcVxT3oJ1R6E?usp=sharing" data-cloud-link="record"
                        target="_blank" rel="noopener">查看雲端歷史資料</a>
                </div>
            </div>
            <div id="calendarGrid" class="calendar-shell record-shell"></div>
        </div>
    </main>

    <div class="modal fade" id="clockinEditModal" tabindex="-1" aria-labelledby="clockinEditTitle" aria-hidden="true">
        <div class="modal-dialog modal-lg">
            <div class="modal-content">
                <form id="clockinEditForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="clockinEditTitle">補正</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" for="clockinEditClockin">上班時間</label>
                            <input type="time" class="form-control" id="clockinEditClockin">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="clockinEditClockout">下班時間</label>
                            <input type="time" class="form-control" id="clockinEditClockout">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="clockinEditReason">修改原因</label>
                            <textarea class="form-control" id="clockinEditReason" maxlength="200" rows="3"></textarea>
                        </div>
                        <hr>
                        <div class="fw-bold mb-1">打卡明細</div>
                        <div class="small text-muted mb-2">上班、下班可以分開刪除，刪除後不再計入打卡紀錄。</div>
                        <div id="punchNotice" class="alert alert-warning small py-2 d-none"></div>
                        <div id="punchList"></div>
                        <div id="punchActionBox" class="d-none border rounded p-3 mb-3">
                            <div class="fw-bold mb-2" id="punchActionTitle"></div>
                            <label class="form-label" for="punchActionReason" id="punchActionLabel">原因（必填）</label>
                            <textarea class="form-control mb-2" id="punchActionReason" maxlength="200" rows="2"></textarea>
                            <div class="d-flex gap-2 justify-content-end">
                                <button type="button" class="btn btn-secondary btn-sm" id="punchActionCancel">取消</button>
                                <button type="button" class="btn btn-danger btn-sm" id="punchActionSubmit">確認刪除</button>
                            </div>
                        </div>
                        <div id="punchAudit"></div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-primary" id="clockinEditSave">儲存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/cookieOperation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
    <script src="../js/adminRecord.js"></script>
</body>

</html>
