<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
    <title>祐肯請假系統</title>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <link rel="icon" href="../../img/logo.ico" type="image/x-icon">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="../css/calendar.css">
    <link rel="stylesheet" href="../css/adminPersonnel.css">
</head>

<body>

    <div id="navbar-container"></div>

    <section>
        <div class="container">
            <div class="row">
                <div class="col">
                    <div class="record-page-header">
                        <h1>打卡紀錄</h1>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <section>
        <div class="container">
            <div class="row">
                <div class="col">
                    <div id="calendar" class="record-calendar-page">
                        <div class="calendar-toolbar record-toolbar">
                            <div class="calendar-filters record-filters">
                                <select id="year" class="form-select calendar-select">
                                    <option value="2025">2025年</option>
                                    <option value="2026">2026年</option>
                                </select>
                                <select id="month" class="form-select calendar-select">
                                    <option value="1">1月</option>
                                    <option value="2">2月</option>
                                    <option value="3">3月</option>
                                    <option value="4">4月</option>
                                    <option value="5">5月</option>
                                    <option value="6">6月</option>
                                    <option value="7">7月</option>
                                    <option value="8">8月</option>
                                    <option value="9">9月</option>
                                    <option value="10">10月</option>
                                    <option value="11">11月</option>
                                    <option value="12">12月</option>
                                </select>
                                <select id="day" class="form-select calendar-select"></select>
                                <select id="employee" class="form-select calendar-select" aria-label="員工">
                                    <option value="">全部</option>
                                </select>
                                <button id="upData" class="btn btn-primary">重新載入</button>
                                <button id="downloadMaster" class="btn btn-outline-primary" type="button" disabled title="請先重新載入，產生該月總表">下載月總表</button>
                                <a class="btn btn-outline-secondary"
                                    href="https://drive.google.com/drive/folders/1_4mNF0GZOGRhZ30ZHcm6zcVxT3oJ1R6E?usp=sharing"
                                    target="_blank" rel="noopener">查看雲端歷史資料</a>
                            </div>
                        </div>
                        <div id="calendarGrid" class="calendar-shell record-shell"></div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <div class="modal fade" id="clockinEditModal" tabindex="-1" aria-labelledby="clockinEditTitle" aria-hidden="true">
        <div class="modal-dialog">
            <div class="modal-content">
                <form id="clockinEditForm">
                    <div class="modal-header">
                        <h5 class="modal-title" id="clockinEditTitle">補正</h5>
                        <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="關閉"></button>
                    </div>
                    <div class="modal-body">
                        <div class="mb-3">
                            <label class="form-label" for="clockinEditClockin">上班時間</label>
                            <input type="time" class="form-control" id="clockinEditClockin">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="clockinEditClockout">下班時間</label>
                            <input type="time" class="form-control" id="clockinEditClockout">
                        </div>
                        <div class="mb-3">
                            <label class="form-label" for="clockinEditReason">修改原因</label>
                            <textarea class="form-control" id="clockinEditReason" maxlength="200" rows="3"></textarea>
                        </div>
                    </div>
                    <div class="modal-footer">
                        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">取消</button>
                        <button type="submit" class="btn btn-primary" id="clockinEditSave">儲存</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <script src="../js/jquery-3.7.1.min.js"></script>
    <script src="../js/cookieOperation.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.1.1/dist/js/bootstrap.bundle.min.js"></script>
    <script src="../js/adminRecord.js"></script>
</body>

</html>
