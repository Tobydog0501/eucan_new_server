<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>祐肯請假系統</title>
	<link rel="icon" type="image/x-icon" href="../img/logo.ico">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="../css/theme.css">
	<link id="eucan-navbar-css" rel="stylesheet" href="../css/navbar.css">
</head>

<body>

	<div id="navbar-container"></div>

	<main class="eu-page">
		<header class="eu-page-header">
			<h1 class="eu-page-title">新增員工</h1>
		</header>

		<section class="eu-card eu-page-narrow ms-0">
			<div class="row g-3">
				<div class="col-sm-6">
					<label for="code" class="form-label">員工編號</label>
					<input placeholder="員工編號" id="code" class="form-control input">
				</div>

				<div class="col-sm-6">
					<label for="pwd" class="form-label">身分證字號</label>
					<input placeholder="身分證字號" id="pwd" class="form-control input">
				</div>

				<div class="col-sm-6">
					<label for="name" class="form-label">員工姓名</label>
					<input placeholder="員工姓名" id="name" class="form-control input">
				</div>

				<div class="col-sm-6">
					<label for="joinDate" class="form-label">到職日期</label>
					<input type="date" min="2024-01-01" max="5000-12-31" id="joinDate" class="form-control input">
				</div>

				<div class="col-12">
					<label for="email" class="form-label">電子信箱</label>
					<input placeholder="電子信箱" id="email" class="form-control input">
				</div>

				<div class="col-sm-6">
					<label for="mgroup" class="form-label">直屬主管</label>
					<select id="mgroup" class="form-select input">
						<option>選擇主管</option>
						<option id="1">CAT</option>
						<option id="0">JEFF</option>
					</select>
				</div>

				<div class="col-sm-6">
					<label for="review" class="form-label">審核確認</label>
					<select id="review" class="form-select input">
						<option>請假是否需要審核</option>
						<option id="1">需要審核</option>
						<option id="0">不需要審核</option>
					</select>
				</div>

				<div class="col-12">
					<button id="confirm" class="btn btn-primary">確認</button>
				</div>
			</div>
		</section>
	</main>

	<script src="../js/jquery-3.7.1.min.js"></script>
	<script src="../js/cookieOperation.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	<script src="../js/adminMaintain.js"></script>
</body>

</html>
