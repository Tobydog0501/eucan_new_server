<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
	<meta charset="UTF-8">
	<meta name="viewport" content="width=device-width, initial-scale=1">
	<title>祐肯請假系統</title>
	<link rel="icon" type="image/x-icon" href="../img/logo.ico">
	<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
	<link rel="stylesheet" href="../css/theme.css">
	<link id="eucan-navbar-css" rel="stylesheet" href="../css/navbar.css">
</head>

<body>

	<div id="navbar-container"></div>

	<main class="eu-page">
		<header class="eu-page-header">
			<h1 class="eu-page-title">過審紀錄</h1>
		</header>

		<div id="search" class="eu-toolbar">
			<input placeholder="員工編號" id="code" class="search form-control">
			<input placeholder="年度" id="year" class="search form-control">
			<input placeholder="月份(需求兩位數)" id="month" class="search form-control">
			<button id="searching" class="search btn btn-primary">搜尋</button>
		</div>

		<div class="eu-card eu-card-flush">
			<div class="table-responsive">
				<table class="table table-striped">
					<thead>
						<tr>
							<th>流水號</th>
							<th>員工姓名</th>
							<th>假別</th>
							<th>開始時間</th>
							<th>結束時間</th>
							<th>總時數</th>
							<th>理由</th>
							<th>操作</th>
						</tr>
					</thead>
					<tbody id="table">

					</tbody>
				</table>
			</div>
		</div>
		<nav class="eu-pager" aria-label="分頁">
			<button id="prevPage" class="btn btn-outline-secondary">上一頁</button>
			<span id="pageInfo"></span>
			<button id="nextPage" class="btn btn-outline-secondary">下一頁</button>
		</nav>
	</main>

	<script src="../js/jquery-3.7.1.min.js"></script>
	<script src="../js/cookieOperation.js"></script>
	<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js" integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz" crossorigin="anonymous"></script>
	<script src="../js/adminLog.js"></script>
</body>

</html>
