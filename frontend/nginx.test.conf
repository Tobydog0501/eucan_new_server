# Test-site frontend nginx (docker-compose-test.yml mounts this over the
# image's /etc/nginx/conf.d/nginx.conf). Same static site as production, plus
# a same-origin proxy to the backend, so a test site needs one hostname and the
# backend port does not have to be published.
#
# backend/test/nginx_test_conf.test.js checks that every backend route is
# proxied here and that the upload limit matches production
# (nginx/conf.d/default.conf). Add new root-level POST routes to the list below.
server {
  listen       8000 default_server;
  listen       [::]:8000 default_server;
  server_name  _;
  root         /usr/share/nginx/html;
  index        index.html;
  charset      utf-8;
  # Same limit as production.
  client_max_body_size 2G;

  access_log /var/log/nginx/access_log;
  error_log  /var/log/nginx/error_log;

  # Applies to every proxied location below.
  proxy_http_version 1.1;
  proxy_set_header Host $host;
  proxy_set_header X-Real-IP $remote_addr;
  proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
  # Passed through from the tunnel or proxy in front, if any.
  proxy_set_header X-Forwarded-Proto $http_x_forwarded_proto;
  proxy_read_timeout 120s;

  # Build and config files are not part of the site (also kept out of the
  # image by .dockerignore).
  location ~ ^/(Dockerfile[^/]*|nginx(\.test)?\.conf|docker-compose[^/]*\.ya?ml|run\.bat|\.dockerignore|\.gitignore)$ {
    return 404;
  }

  # Backend: every /api/* route.
  location ^~ /api/ {
    proxy_pass http://backend:3000;
  }

  # Backend: the root-level POST routes (backend/src/main.ts, `posts`).
  location ~ ^/(login|users|session|register|dayoff|request|query|permit|init|approved|empquery|delete|modify|quota|clockin|sync|calendar|clrecord|tmodify|modemp|batchrequest)$ {
    proxy_pass http://backend:3000;
  }

  # Backend liveness ("System online.").
  location = /healthz {
    proxy_pass http://backend:3000/;
  }

  location / {
    add_header Last-Modified $date_gmt;
    add_header Cache-Control 'no-store, no-cache';
    if_modified_since off;
    expires off;
    etag off;
  }
}
