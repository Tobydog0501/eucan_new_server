name: Deploy production

# Continuous deployment: every push to main whose "Backend tests" run passes is
# deployed to the production host. The deploy job runs on a self-hosted runner
# installed on that host (labels: self-hosted, eucan-prod), so GitHub never
# needs SSH access or keys for it. Setup: README, "自動部署（CD）".
#
# Only push-to-main (via workflow_run) and manual runs reach the self-hosted
# runner; no pull_request trigger here, so code from forks never runs on it.

on:
  workflow_run:
    workflows: ["Backend tests"]
    types: [completed]
    branches: [main]
  workflow_dispatch:
    inputs:
      ref:
        description: "Commit on main to deploy (empty = latest main)"
        required: false
        default: ""

permissions:
  contents: read

# One deploy at a time, never cancel one halfway; a newer queued run replaces
# an older queued one.
concurrency:
  group: deploy-production
  cancel-in-progress: false

jobs:
  deploy:
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' &&
       github.event.workflow_run.event == 'push' &&
       github.event.workflow_run.head_branch == 'main' &&
       github.event.workflow_run.head_repository.full_name == github.repository)
    runs-on: [self-hosted, eucan-prod]
    environment: production
    timeout-minutes: 60
    steps:
      # Only the deploy script is taken from this checkout; the production
      # checkout itself (DEPLOY_DIR) is updated by the script.
      - uses: actions/checkout@v4
        with:
          ref: main
          persist-credentials: false
          sparse-checkout: scripts
          path: cd

      - name: Deploy
        env:
          DEPLOY_DIR: ${{ vars.DEPLOY_DIR }}
          DEPLOY_SHA: ${{ github.event.workflow_run.head_sha || inputs.ref }}
        run: |
          if [ -z "${DEPLOY_DIR}" ]; then
            echo "::error::Repository variable DEPLOY_DIR is not set (path of the production checkout)"; exit 1
          fi
          bash cd/scripts/deploy.sh
